<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title> NEET Study Hub </title>

<style>
body{
    font-family:Arial,sans-serif;
    background:#f4f7fa;
    margin:0;
}

header{
    background:#1565c0;
    color:white;
    text-align:center;
    padding:20px;
}

section{
    margin:20px;
}

.chapter-box{
    background:white;
    margin:10px 0;
    padding:15px;
    border-radius:10px;
    box-shadow:0 0 5px rgba(0,0,0,0.15);
}

.btn{
    display:inline-block;
    margin:5px;
    padding:8px 12px;
    text-decoration:none;
    color:white;
    border-radius:5px;
}

.video{
    background:#1565c0;
}

.pyq{
    background:#2e7d32;
}
</style>
</head>

<body>

<header>
<h1> NEET STUDY HUB (VDO & PYQ )
</h1>
<p>Videos + Previous Year Questions</p>
</header>

<section>
<h2>Physics</h2>
<div id="physics"></div>

<h2>Chemistry</h2>
<div id="chemistry"></div>
</section>

<script>
const physicsChapters = [

"Physical World",
"Units and Measurements",
"Motion in a Straight Line",
"Motion in a Plane",
"Laws of Motion",
"Work Energy and Power",
"System of Particles and Rotational Motion",
"Gravitation",
"Mechanical Properties of Solids",
"Mechanical Properties of Fluids",
"Thermal Properties of Matter",
"Thermodynamics",
"Kinetic Theory",
"Oscillations",
"Waves",

"Electric Charges and Fields",
"Electrostatic Potential and Capacitance",
"Current Electricity",
"Moving Charges and Magnetism",
"Magnetism and Matter",
"Electromagnetic Induction",
"Alternating Current",
"Electromagnetic Waves",
"Ray Optics and Optical Instruments",
"Wave Optics",
"Dual Nature of Radiation and Matter",
"Atoms",
"Nuclei",
"Semiconductor Electronics"

];

const chemistryChapters = [

"Some Basic Concepts of Chemistry",
"Structure of Atom",
"Classification of Elements and Periodicity",
"Chemical Bonding and Molecular Structure",
"States of Matter",
"Thermodynamics",
"Equilibrium",
"Redox Reactions",
"Hydrogen",
"s Block Elements",
"Organic Chemistry Basic Principles and Techniques",
"Hydrocarbons",

"Solid State",
"Solutions",
"Electrochemistry",
"Chemical Kinetics",
"Surface Chemistry",
"General Principles and Processes of Isolation of Elements",
"p Block Elements",
"d and f Block Elements",
"Coordination Compounds",
"Haloalkanes and Haloarenes",
"Alcohols Phenols and Ethers",
"Aldehydes Ketones and Carboxylic Acids",
"Amines",
"Biomolecules",
"Polymers",
"Chemistry in Everyday Life"

];

function createChapters(list, containerId){

const container = document.getElementById(containerId);

list.forEach(chapter=>{

const search = chapter.replaceAll(" ","+");

container.innerHTML += `
<div class="chapter-box">
<h3>${chapter}</h3>

<a class="btn video" target="_blank"
href="https://www.youtube.com/results?search_query=${search}+NEET">
📺 Video
</a>

<a class="btn pyq" target="_blank"
href="https://www.google.com/search?q=${search}+NEET+Previous+Year+Questions+PDF">
📝 PYQ
</a>

</div>
`;
});
}

createChapters(physicsChapters,"physics");
createChapters(chemistryChapters,"chemistry");

</script>

</body>
</html>
